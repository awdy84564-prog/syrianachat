<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYRIANACHAT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-screen" class="screen active">
    <h1>SYRIANACHAT</h1>
    <input id="username" placeholder="اسم المستخدم">
    <input id="password" type="password" placeholder="كلمة السر">
    <button onclick="login()">دخول</button>
    <button onclick="register()">تسجيل</button>
  </div>

  <div id="chat-screen" class="screen">
    <div id="sidebar">
      <h3 style="padding:10px">الغرف</h3>
      <div id="rooms-list"></div>
      <h3 style="padding:10px">المتصلين</h3>
      <div id="users-list"></div>
      <div id="voice-controls">
        <button class="voice-btn mic-on" id="mic-btn">🎤</button>
        <button class="voice-btn" onclick="leaveVoice()">خروج</button>
      </div>
    </div>
    <div id="main-chat">
      <div id="messages"></div>
      <div id="input-area">
        <input id="msg-input" placeholder="اكتب رسالتك">
        <button onclick="sendMessage()">إرسال</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
