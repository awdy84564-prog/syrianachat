<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شات باب الحارة الصوتي</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#1a1a1a;color:#fff;height:100vh;overflow:hidden}
.screen{display:none;height:100vh}
.active{display:flex}
#login-screen,#register-screen{justify-content:center;align-items:center;flex-direction:column}
input,button,select{padding:12px;margin:8px;width:300px;border:none;border-radius:8px;font-size:16px}
button{background:#ff8800;color:#000;font-weight:bold;cursor:pointer}
button:hover{background:#ffaa00}
#chat-screen{flex-direction:row}
#sidebar{width:250px;background:#222;border-left:2px solid #333;overflow-y:auto}
#main-chat{flex:1;display:flex;flex-direction:column}
#messages{flex:1;overflow-y:auto;padding:15px;background:#151515}
.msg{margin:10px 0;padding:8px;background:#222;border-radius:5px}
.msg.user{font-weight:bold}
#input-area{display:flex;padding:10px;background:#222}
#msg-input{flex:1;margin:0}
#users-list{padding:10px}
.user-item{padding:8px;margin:5px 0;background:#333;border-radius:5px}
.rank-badge{font-size:12px;padding:2px 6px;border-radius:3px;margin-left:5px}
#voice-controls{padding:10px;background:#333;display:flex;gap:10px}
.voice-btn{width:50px;height:50px;border-radius:50%;border:none;cursor:pointer}
.mic-on{background:#00ff00}
.mic-off{background:#ff0000}
</style>
</head>
<body>
<div id="login-screen" class="screen active">
  <h2>دخول</h2>
  <input id="login-user" placeholder="اسم المستخدم">
  <input id="login-pass" type="password" placeholder="كلمة السر">
  <button onclick="login()">دخول</button>
  <p>ما عندك حساب؟ <a href="#" onclick="showRegister()">سجل الآن</a></p>
</div>

<div id="register-screen" class="screen">
  <h2>تسجيل جديد</h2>
  <input id="reg-user" placeholder="اسم المستخدم">
  <input id="reg-pass" type="password" placeholder="كلمة السر">
  <button onclick="register()">تسجيل</button>
  <p>عندك حساب؟ <a href="#" onclick="showLogin()">دخول</a></p>
</div>

<div id="chat-screen" class="screen">
  <div id="sidebar">
    <h3 style="padding:10px">الغرف</h3>
    <div id="rooms-list"></div>
    <h3 style="padding:10px">المتصلين</h3>
    <div id="users-list"></div>
    <div id="voice-controls">
      <button class="voice-btn mic-on" id="mic-btn" onclick="toggleMic()">🎤</button>
      <button class="voice-btn" onclick="leaveVoice()">📞</button>
    </div>
  </div>
  <div id="main-chat">
    <div id="messages"></div>
    <div id="input-area">
      <input id="msg-input" placeholder="اكتب رسالتك...">
      <button onclick="sendMessage()">إرسال</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
